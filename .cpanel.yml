---
# cPanel Git deployment for ncrc.namotech.in (PHP 8.3).
# The repository checkout is the subdomain's document root; the React build is
# copied over it and the root .htaccess routes /api to backend/public/index.php.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/namoteuj/ncrc.namotech.in/
    - export PHP=/opt/cpanel/ea-php83/root/usr/bin/php
    # Not "COMPOSER": Composer reads that variable as the path to composer.json.
    - export COMPOSER_BIN=$(command -v composer || echo /opt/cpanel/composer/bin/composer)
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R frontend/dist/. $DEPLOYPATH
    # The old /api symlink made Laravel see "/login" instead of "/api/login"; routing is in .htaccess now.
    - /bin/rm -f $DEPLOYPATH/api
    - /bin/chmod 755 $DEPLOYPATH
    - cd backend && $PHP $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
    # Directories only: chmod on tracked files shows up as uncommitted changes and blocks deploys.
    - cd backend && /usr/bin/find storage bootstrap/cache -type d -exec /bin/chmod 775 {} +
    - cd backend && ($PHP artisan storage:link || true)
    - cd backend && $PHP artisan config:cache
    - cd backend && $PHP artisan route:cache
    - cd backend && $PHP artisan view:cache
